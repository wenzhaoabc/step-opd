# @package _global_
defaults:
  - /ppo_trainer
  - /config/protocol
  - /config/curriculum
  - _self_

stepopd:
  environment: alfworld_f2b
  algorithm: opd
  data_dir: ${oc.env:STEPOPD_ROOT}/envs/alfworld
  retrieval_url: http://127.0.0.1:8000/retrieve
  max_tokens_per_turn: 1024

data:
  train_files: ${stepopd.data_dir}/train.parquet
  val_files: ${stepopd.data_dir}/val.parquet
  train_batch_size: 12
  max_prompt_length: 8192
  max_response_length: 8192
  dataloader_num_workers: 0
  val_max_samples: 20
  validation_shuffle: true
  seed: 42

actor_rollout_ref:
  model:
    path: ${oc.env:STEPOPD_ROOT}/../models/Qwen3-1.7B
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: ${data.train_batch_size}
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 16384
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  rollout:
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.8
    max_model_len: 16385
    n: 1
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    agent:
      num_workers: 12
      agent_loop_manager_class: stepopd.opd.worker.TeacherEvidenceManager
    val_kwargs:
      temperature: 0.4
      do_sample: true
      n: 1

trainer:
  nnodes: 1
  n_gpus_per_node: 6
  logger: [console, tensorboard, wandb]
  project_name: stepopd_agenticrl
  experiment_name: alfworld_f2b_30b_to_1p7b
  default_local_dir: ${oc.env:STEPOPD_ROOT}/outputs/f2b/${trainer.experiment_name}
  rollout_data_dir: ${trainer.default_local_dir}/rollouts
  total_training_steps: 250
  total_epochs: 1
  save_freq: 25
  test_freq: 5
  val_before_train: false
  max_actor_ckpt_to_keep: 2
  resume_mode: auto

distillation:
  enabled: true
  nnodes: 1
  n_gpus_per_node: 2
  teacher_models:
    teacher_model:
      model_path: ${oc.env:STEPOPD_ROOT}/../models/Qwen3-30B-A3B
      num_replicas: 1
      inference:
        name: vllm
        tensor_model_parallel_size: 2
        max_model_len: ${actor_rollout_ref.rollout.max_model_len}
        gpu_memory_utilization: 0.8
  distillation_loss:
    loss_mode: k1
    use_policy_gradient: true
    use_task_rewards: false
    loss_max_clamp: 15
